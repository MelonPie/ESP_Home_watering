####################################################
# Text sensors
text_sensor:
  - platform: homeassistant
    id: ui_irrigation_start
    entity_id: $irrigation_times_entity
    on_value:
      then:
        - text_sensor.template.publish:
            id: irrigation_times
            state: !lambda return id(ui_irrigation_start).state;

  - platform: template
    name: $irrigation_name times
    id: irrigation_times
    on_value:
      then:
        - text_sensor.template.publish:
            id: irrigation_next
            state: !lambda |-
              return update_next_runtime(id(irrigation_times).state);

  - platform: template
    name: $irrigation_name next
    id: irrigation_next

####################################################
# Interval: single tick replaces all per-zone countdown logic
interval:
  - interval: 5s
    then:
      - lambda: zone_tick();

#########################################################
# Display
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false
  frequency: 400kHz

font:
  - file: 'slkscr.ttf'
    id: font1
    size: 10

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      if(id(wifi_01).is_connected()) {
        it.printf(0, 0, id(font1), TextAlign::TOP_LEFT , "Wifi");
      }
      if(id(ha_api).is_connected()) {
        it.printf(127, 0, id(font1), TextAlign::TOP_RIGHT , "HA API");
      }
      if(id(sync_time).now().is_valid()){
        it.printf(127, 60, id(font1), TextAlign::BASELINE_RIGHT , "Sync");
      }
      it.strftime(0, 60, id(font1), TextAlign::BASELINE_LEFT, "%d.%m.%y %H:%M:%S", id(sync_time).now());
      // Zone status
      if (active_zone >= 0) {
        float watered = id(flow_total).state - liters_start[active_zone];
        float target = zone_liters_target[active_zone]->state;
        int mins_left = (safety_remaining[active_zone] / 60) + 1;
        it.printf(0, 20, id(font1), TextAlign::LEFT, "Zone %d: %.1f/%.1fL", active_zone, watered, target);
        it.printf(0, 30, id(font1), TextAlign::LEFT, "Timeout: %dm", mins_left);
      } else {
        it.printf(0, 20, id(font1), TextAlign::LEFT, "Idle");
        it.printf(0, 30, id(font1), TextAlign::LEFT, "Next: %s", id(irrigation_next).state.c_str());
      }
      // Schedule info
      it.printf(0, 10, id(font1), TextAlign::LEFT, id(scheduled_watering_activated).state ? "Scheduled" : "Not scheduled");
      it.printf(127, 10, id(font1), TextAlign::RIGHT, id(irrigation_times).state.c_str());

# IO Expander
pcf8574:
  - id: 'sat1'
    address: 0x20
    pcf8575: false

####################################################
# Switches
switch:
  # Virtual scheduling switch
  - platform: template
    name: "Scheduled watering Activated"
    id: "scheduled_watering_activated"
    optimistic: true

  # Virtual zone switches: check liters_target > 0 OR duration > 0 before enabling
  - platform: template
    name: "Zone 0"
    id: irrigation_zone0
    lambda: return id(pin0).state;
    optimistic: true
    turn_on_action:
      if:
        condition:
          lambda: return id(irrigation_zone0_liters_target).state > 0 || id(irrigation_zone0_duration).state > 0;
        then:
          - switch.turn_on: pin0
        else:
          - lambda: advance_to_next_zone(0);
    turn_off_action:
      - switch.turn_off: pin0

