esphome:
  name: irrigation-reloaded
  friendly_name: Irrigation_reloaded
  includes:
    - irrigation.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          void irrigation_init();
          irrigation_init();


esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  id: ha_api
  encryption:
    key: "5BBIjTdJiRUh+pm6veOCKQA4HpIUZr+vD+rSkquZE14="

ota:
  - platform: esphome
    password: "0ce18c012cc9dfd451f4a837b5721be9"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  id: wifi_01
  reboot_timeout: 0s
  manual_ip:
    static_ip: 192.168.2.27
    gateway: 192.168.2.1
    subnet: 255.255.255.0
    dns1: 192.168.2.1
  ap:
    ssid: "Irrigation-reloaded"
    password: "Tbgs0HxpnHJM"

substitutions:
  friendly_name: Irrigation-dev
  id: irrigation-dev
  hostname: irrigation-dev
  irrigation_name: Irrigation
  irrigation_times_entity: input_text.irrigation_dev_times
  zone2_name: Pool filler
  zone2_times_entity: input_text.pool_filler_times

captive_portal:

# Shift register chain: 3x SN74HC595 = 24 outputs, using 20
# Pins moved off GPIO12/13/14: GPIO12 is a strapping pin (flash voltage select)
# and GPIO14/15 emit bootloader debug pulses, which clocked random data into the
# SRs and turned valves on at reset. /OE is held high by an external 10k pull-up
# to +5V while GPIO16 is high-Z (boot), keeping all SR outputs disabled until
# ESPHome has shifted in zeros and explicitly drives /OE low.
sn74hc595:
  - id: 'sn74hc595_hub'
    data_pin: GPIO23
    clock_pin: GPIO18
    latch_pin: GPIO17
    oe_pin:
      number: GPIO16
      mode:
        output: true
        open_drain: true
    sr_count: 3

# Time
time:
  - platform: homeassistant
    id: sync_time
    timezone: Europe/Berlin
    on_time:
      - seconds: 0
        minutes: /2
        then:
          - lambda: |-
              bool scheduled_runtime(std::string);
              if (scheduled_runtime(id(irrigation_next).state.c_str()) && id(scheduled_watering_activated).state) {
                id(irrigation_zone0).turn_on();
              }

# Remote logging to Splunk via syslog UDP
udp:
  id: udp_syslog
  addresses:
    - 192.168.2.148

syslog:
  udp_id: udp_syslog
  time_id: sync_time
  port: 2514
  facility: 16
  level: DEBUG
  strip: true

####################################################
# Zone packages: each include creates duration, liters_target,
# remaining sensors, virtual switch, and GPIO switch for one zone
packages:
  zone0:  !include { file: zone.yaml, vars: { zone_id: "0" } }
  zone1:  !include { file: zone.yaml, vars: { zone_id: "1" } }
  zone2:  !include { file: zone.yaml, vars: { zone_id: "2" } }
  zone3:  !include { file: zone.yaml, vars: { zone_id: "3" } }
  zone4:  !include { file: zone.yaml, vars: { zone_id: "4" } }
  zone5:  !include { file: zone.yaml, vars: { zone_id: "5" } }
  zone6:  !include { file: zone.yaml, vars: { zone_id: "6" } }
  zone7:  !include { file: zone.yaml, vars: { zone_id: "7" } }
  zone8:  !include { file: zone.yaml, vars: { zone_id: "8" } }
  zone9:  !include { file: zone.yaml, vars: { zone_id: "9" } }
  zone10: !include { file: zone.yaml, vars: { zone_id: "10" } }
  zone11: !include { file: zone.yaml, vars: { zone_id: "11" } }
  zone12: !include { file: zone.yaml, vars: { zone_id: "12" } }
  zone13: !include { file: zone.yaml, vars: { zone_id: "13" } }
  zone14: !include { file: zone.yaml, vars: { zone_id: "14" } }
  zone15: !include { file: zone.yaml, vars: { zone_id: "15" } }
  zone16: !include { file: zone.yaml, vars: { zone_id: "16" } }
  zone17: !include { file: zone.yaml, vars: { zone_id: "17" } }
  zone18: !include { file: zone.yaml, vars: { zone_id: "18" } }
  zone19: !include { file: zone.yaml, vars: { zone_id: "19" } }

####################################################
# Sensors
sensor:
  - platform: uptime
    name: $friendly_name Uptime
    unit_of_measurement: h
    entity_category: diagnostic
    filters:
      - lambda: return int((x + 1800.0) / 3600.0);

  - platform: wifi_signal
    name: $friendly_name WiFi Signal
    update_interval: 30s
    entity_category: diagnostic

  - platform: pulse_counter
    pin: GPIO34
    name: "Fluss"
    id: flow_rate
    update_interval: 5s
    unit_of_measurement: "L/min"
    filters:
      - multiply: 1.0  # TODO: calibrate with 5L can → 5.0 / pulse_count
    total:
      unit_of_measurement: 'L'
      name: 'Menge'
      id: flow_total
      filters:
        - multiply: 1.0  # TODO: calibrate with 5L can → 5.0 / pulse_count

####################################################
# Text sensors
text_sensor:
  - platform: homeassistant
    id: ui_irrigation_start
    entity_id: $irrigation_times_entity
    on_value:
      then:
        - text_sensor.template.publish:
            id: irrigation_times
            state: !lambda return id(ui_irrigation_start).state;

  - platform: template
    name: $irrigation_name times
    id: irrigation_times
    on_value:
      then:
        - text_sensor.template.publish:
            id: irrigation_next
            state: !lambda |-
              std::string update_next_runtime(std::string);
              return update_next_runtime(id(irrigation_times).state);

  - platform: template
    name: $irrigation_name next
    id: irrigation_next

####################################################
# Interval: single tick replaces all per-zone countdown logic
interval:
  - interval: 5s
    then:
      - lambda: |-
          void zone_tick();
          zone_tick();

#########################################################
# Display
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false
  frequency: 400kHz

font:
  - file: 'slkscr.ttf'
    id: font1
    size: 10

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      extern int active_zone;
      extern float liters_start[];
      extern int safety_remaining[];
      extern esphome::template_::TemplateNumber *zone_liters_target[];
      if(id(wifi_01).is_connected()) {
        it.printf(0, 0, id(font1), TextAlign::TOP_LEFT , "Wifi");
      }
      if(id(ha_api).is_connected()) {
        it.printf(127, 0, id(font1), TextAlign::TOP_RIGHT , "HA API");
      }
      if(id(sync_time).now().is_valid()){
        it.printf(127, 60, id(font1), TextAlign::BASELINE_RIGHT , "Sync");
      }
      it.strftime(0, 60, id(font1), TextAlign::BASELINE_LEFT, "%d.%m.%y %H:%M:%S", id(sync_time).now());
      // Zone status
      if (active_zone >= 0) {
        float watered = id(flow_total).state - liters_start[active_zone];
        float target = zone_liters_target[active_zone]->state;
        int mins_left = (safety_remaining[active_zone] + 59) / 60;
        it.printf(0, 20, id(font1), TextAlign::LEFT, "Zone %d: %.1f/%.1fL", active_zone, watered, target);
        it.printf(0, 30, id(font1), TextAlign::LEFT, "Timeout: %dm", mins_left);
      } else {
        it.printf(0, 20, id(font1), TextAlign::LEFT, "Idle");
        it.printf(0, 30, id(font1), TextAlign::LEFT, "Next: %s", id(irrigation_next).state.c_str());
      }
      // Schedule info
      it.printf(0, 10, id(font1), TextAlign::LEFT, id(scheduled_watering_activated).state ? "Scheduled" : "Not scheduled");
      it.printf(127, 10, id(font1), TextAlign::RIGHT, id(irrigation_times).state.c_str());

####################################################
# Binary sensors
binary_sensor:
  - platform: template
    name: "Leak detected"
    id: leak_detected
    device_class: moisture
    icon: mdi:pipe-leak

  - platform: template
    name: "No flow alert"
    id: no_flow_alert
    device_class: problem
    icon: mdi:water-off

####################################################
# Switches (non-zone)
switch:
  - platform: template
    name: "Scheduled watering Activated"
    id: "scheduled_watering_activated"
    optimistic: true
