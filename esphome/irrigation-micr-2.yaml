esphome:
  name: irrigation-micro-2
  friendly_name: Irrigation_micro_2
  includes:
    - irrigation.h
  on_boot:
    priority: -100
    then:
      - lambda: irrigation_init();

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  id: ha_api
  encryption:
    key: "9lMZl9GNWKbU0Xq2Zqbz4FnXtPONagObo5sFGl1wbHQ="

ota:
  - platform: esphome
    password: "075ea10192d1ae35844cd0d33e88d2af"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  id: wifi_01
  reboot_timeout: 0s
  ap:
    ssid: "Irrigation-Micro-2"
    password: "Tbgs0HxpnHJM"

substitutions:
  friendly_name: Irrigation-dev
  id: irrigation-dev
  hostname: irrigation-dev
  irrigation_name: Irrigation
  irrigation_times_entity: input_text.irrigation_dev_times
  zone2_name: Pool filler
  zone2_times_entity: input_text.pool_filler_times

captive_portal:

# Shift register chain: 3x SN74HC595 = 24 outputs, using 20
sn74hc595:
  - id: 'sn74hc595_hub'
    data_pin: GPIO19
    clock_pin: GPIO18
    latch_pin: GPIO17
    sr_count: 3

# Time
time:
  - platform: homeassistant
    id: sync_time
    timezone: Europe/Berlin
    on_time:
      - seconds: 0
        minutes: /2
        then:
          - lambda: |-
              if (scheduled_runtime(id(irrigation_next).state.c_str()) && id(scheduled_watering_activated).state) {
                id(irrigation_zone0).turn_on();
              }

