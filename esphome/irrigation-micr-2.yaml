  #######################################################################
  # GPIO switches via shift register (20 zones)
  #######################################################################
  - platform: gpio
    id: "pin0"
    pin:
      sn74hc595: sn74hc595_hub
      number: 0
      inverted: false
    on_turn_on:
      then:
        - lambda: start_zone(0);
    on_turn_off:
      then:
        - lambda: stop_zone(0);

