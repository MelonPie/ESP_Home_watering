  # ============================================================================= #
  # Virtual switches to control behaviour
  - platform: template
    name: "Scheduled watering Activated"
    id: "scheduled_watering_activated"
    optimistic: true
  # Virtual zone Switches which toggle the pin, and store the current state.
  
  - platform: template
    name: "Zone 0"
    id: irrigation_zone0
    lambda: return id(pin0).state;
    optimistic: true
    turn_on_action:
      # Turn on if not disabled.
      if:
        condition:
          #lambda: return id(irrigation_zone0_liters_target) > 0;
          lambda: return id(irrigation_zone0_duration) > 0;
        then:
