text_sensor:
  # ============================================================================= #
  # Retrieve list of times from the Home Assistant UI.
  - platform: homeassistant
    id: ui_irrigation_start
    entity_id: $irrigation_times_entity
    on_value:
      then:
        #- delay: 10sec
        - text_sensor.template.publish:
            id: irrigation_times
            state: !lambda return id(ui_irrigation_start).state;

  # ============================================================================= #
  # Store time lists.
  - platform: template
    name: $irrigation_name times
    id: irrigation_times
    on_value:
      then:
        # Update the next scheduled run time.
        - text_sensor.template.publish:
            id: irrigation_next
            state: !lambda |-
              return update_next_runtime(id(irrigation_times).state);

  # ============================================================================= #
  # Set the next scheduled time.
  - platform: template
    name: $irrigation_name next
    id: irrigation_next

script:
  - id: check_watering
    then:
      - lambda: |-
          return;

# Update the countdown timers every 5 seconds.
interval:
  - interval: 5s
    then:
      - lambda: |-
          
          if (id(remaining_time0) > 0) {
            // Store the previous time.
            id(remaining_time0_previous) = id(remaining_time0);

            // When the pin is on.
            if (id(pin0).state) {
              // Decrement the timer.
              id(remaining_time0) -= 5;

              // Turn off the pin when the time reaches zero... or the remaining time fails a sanity check!
              //if (id(remaining_time0) <= 0 || id(irrigation_zone0_remaining).state > id(irrigation_zone0_duration).state){
              if (id(remaining_time0) <= 0) {
                id(pin0).turn_off();
                id(remaining_time0) = 0;
                // Jinja 2 if to turn on next pin
                
                  id(irrigation_zone1).turn_on();
                
              }
            }

            // Update the remaining time display.
            if (id(remaining_time0_previous) != id(remaining_time0)) {
              id(irrigation_zone0_remaining).publish_state( (id(remaining_time0)/60) + 1 );
            }
          }
          
