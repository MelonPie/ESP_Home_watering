# Enable logging
logger:

# Enable Home Assistant API
api:
  id: ha_api
  encryption:
    key: "9lMZl9GNWKbU0Xq2Zqbz4FnXtPONagObo5sFGl1wbHQ="

ota:
  - platform: esphome
    password: "075ea10192d1ae35844cd0d33e88d2af"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  id: wifi_01
  # Disable rebooting due to losing connection with Home Assistant. This will allow
  # the watering schedule to continue if Home Assistant goes down. Should it become
  # unresponsive, we can have Home Assistant power cycle a smart plug to reboot it.
  reboot_timeout: 0s
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Irrigation-Micro-2"
    password: "Tbgs0HxpnHJM"

substitutions:
  friendly_name: Irrigation-dev
  id: irrigation-dev
  hostname: irrigation-dev
  irrigation_name: Irrigation
  irrigation_times_entity: input_text.irrigation_dev_times

  zone2_name: Pool filler
  zone2_times_entity: input_text.pool_filler_times

  pin_amount: "4"

captive_portal:
# Prod copy from here
