sensor:
  - platform: uptime
    name: $friendly_name Uptime
    unit_of_measurement: h
    entity_category: diagnostic
    filters:
      - lambda: return int((x + 1800.0) / 3600.0);

  - platform: wifi_signal
    name: $friendly_name WiFi Signal
    update_interval: 30s
    entity_category: diagnostic

  - platform: pulse_counter
    pin: GPIO34
    name: "Fluss"
    update_interval: 5s
    filters:
      - lambda: return (x/1);
    unit_of_measurement: "L/min"
    total:
      unit_of_measurement: 'L'
      name: 'Menge'
      filters:
        - lambda: return (x/1); 
      # on_value_range triggers only at crossing of the value from outside the range to inside
      # Thats why it wont be executed indifinetely with the initial value of 0
      on_value_range: 
        - above: !lambda return id(water_target);
          then: 
            - script.execute: 
                id: check_watering

