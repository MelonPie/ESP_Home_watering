  #######################################################################
  # Actual switches but without input
  # These are necessary because it is not possible to prevent a switch from enabling if a condition
  # (in this case remaining time/liters) is not met
  #######################################################################
  - platform: gpio
    id: "pin0"
    # No name then it maybe wont show
    pin:
      number: "GPIO19"
      inverted: false
    on_turn_on:
      then:
        # Start the countdown timer.
        - globals.set:
            id: remaining_time0
            value: !lambda return id(irrigation_zone0_duration).state * 60;
        # Show the remaining time.
        - sensor.template.publish:
            id: irrigation_zone0_remaining
            state: !lambda return id(irrigation_zone0_duration).state;
        # Show the "Next Time" as "now".
        - text_sensor.template.publish:
            id: irrigation_next
            state: "now"
    on_turn_off:
      then:
        - sensor.template.publish:
            id: irrigation_zone0_remaining
            state: "0"
        # Update the next scheduled run time.
        - text_sensor.template.publish:
            id: irrigation_next
            state: !lambda |-
              return update_next_runtime(id(irrigation_times).state);
  
